
# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Run tests on different versions of python
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest
        pip install numpy
        pip install pandas
    - name: Test with pytest
      run: |
        pytest -s --ignore=W605

  all-tests-passed:
    name: All tests passed
    needs: unittest
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test matrix result
        run: |
          if [ "${{ needs.unittest.result }}" != "success" ]; then
            echo "test matrix did not succeed: ${{ needs.unittest.result }}"
            exit 1
          fi

  sphinx:
    # If the above worked, and this is a real push to master (not a PR):
    # Build docs and deploy to GH Pages
    if: github.event_name == 'push'
    needs: unittest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: 3.9
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[docs]
    - name: Build docs
      run: |
        cd docs
        python generate_color_examples.py
        make html
        touch build/html/.nojekyll
    - name: Setup Pages
      uses: actions/configure-pages@v6
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/build/html
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4